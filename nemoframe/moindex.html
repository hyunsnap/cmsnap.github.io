function place(cw, ch, nw, nh, p) {
  if (!nw || !nh || !cw || !ch) return null;
  const t = ((p.rot || 0) * Math.PI) / 180;
  const c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));
  const bw = cw * c + ch * s, bh = cw * s + ch * c;
  const coverS = Math.max(bw / nw, bh / nh);
  const zoom = p.scale || 1;
  const Rw = nw * coverS * zoom, Rh = nh * coverS * zoom;
  const ovU = Math.max(0, Rw - bw), ovV = Math.max(0, Rh - bh);
  const offU = (p.panU || 0) * ovU / 2, offV = (p.panV || 0) * ovV / 2;
  const cosT = Math.cos(t), sinT = Math.sin(t);
  const offX = offU * cosT - offV * sinT, offY = offU * sinT + offV * cosT;
  const cx = cw / 2 + offX, cy = ch / 2 + offY;
  return { Rw, Rh, left: cx - Rw / 2, top: cy - Rh / 2, cx, cy, ovU, ovV, cosT, sinT };
}

  const exampleImg = (file) => ({

  const gridMmToPx = (gridSize.w && fwIn) ? gridSize.w / (fwIn * 25.4) : 0;
  const gridMetrics = {
    mountPad: gridMmToPx * 5,

    outerBottomPx: gridMmToPx * outerBottomMm,

    colWidths: [], rowHeights: [],
  };

    const areaHpx = Math.max(0, gridSize.h - gridMetrics.mountPad * 2 - gridMetrics.outerTopPx - gridMetrics.outerBottomPx);
    const cwCss = layout.cols ? (areaWpx - gridMetrics.gapPxGrid * (layout.cols - 1)) / layout.cols : 0;

  useEffect(() => {

  // 칸 이동(롱프레스 드래그) 중 처리.
  // [고쳐진 버그] 손님이 사진 순서를 바꿔도 처음 올린 순서 그대로 주문서에 저장되던 문제.
  //  원인1) .nf-cell 이 touch-action:pan-y 라서, 사진을 꾹 눌러 잡은 뒤 손가락을 위/아래로 움직이면
  //         브라우저가 페이지 스크롤을 시작하면서 pointercancel 을 쏜다. 그런데 여기서는 pointerup 만
  //         듣고 있었기 때문에 '내려놓기'가 아예 실행되지 않았고 → setCells 교체가 안 일어남

  //  원인2) 우드 넓은여백처럼 칸 사이 간격이 큰 배치에서 손가락을 여백 위에서 떼면

  useEffect(() => {
    if (!moving) return;

    const onMove = (e) => {

      if (idx == null || Number.isNaN(idx)) return;   // 칸 사이 여백 위를 지나가는 중 — 직전 칸을 그대로 유지
      hoverRef.current = idx; setHoverCell(idx);
    };
    const drop = () => {
      const from = moveFromRef.current, to = hoverRef.current;
      if (from != null && to != null && from !== to) { setCells((prev) => { const n = prev.slice(); const tmp = n[from]; n[from] = n[to]; n[to] = tmp; return n; }); setSelected(to); }
      moveFromRef.current = null; hoverRef.current = null; movePointerRef.current = null; setHoverCell(null); setMoving(false);
    };
    const onUp = (e) => { if (!mine(e)) return; drop(); };
    // 드래그 중 페이지 스크롤 차단 · passive:false 여야 preventDefault 가 실제로 먹는다
    const blockScroll = (e) => { if (e.cancelable) e.preventDefault(); };
    // 안전장치: 어떤 이유로든 손 뗀 신호가 영영 안 오면(앱 전환·전화 수신 등) 15초 뒤 자동으로 내려놓는다.
    // 드래그 중에는 스크롤을 막아두므로, 이동 상태가 갇히면 페이지가 안 움직이게 되는 것을 방지.
    const watchdog = setTimeout(drop, 15000);
    const onHide = () => { if (document.visibilityState === "hidden") drop(); };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);

    document.addEventListener("touchmove", blockScroll, { passive: false });
    document.body.classList.add("nf-dragging");
    return () => {
      clearTimeout(watchdog);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      window.removeEventListener("blur", drop);
      document.removeEventListener("visibilitychange", onHide);
      document.removeEventListener("touchmove", blockScroll);

    };
  }, [moving]);

  const chooseFrame = (cuts) => {

  const buildSetFrame = async (cell, fsize, opts = {}) => {
    const short = Math.min(toIn(fsize.w, fsize.u), toIn(fsize.h, fsize.u));
    const long = Math.max(toIn(fsize.w, fsize.u), toIn(fsize.h, fsize.u));
    const land = cell && cell.landscape;
    const fw = land ? long : short, fh = land ? short : long;
    const scale = opts.preview ? 90 : 300;
    const pw = Math.round(fw * scale), ph = Math.round(fh * scale), m = Math.min(pw, ph);
    const cv = document.createElement("canvas"); cv.width = pw; cv.height = ph;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, pw, ph);
    if (cell && cell.src) {
      const img = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.src = cell.src; });
      const pl = place(pw, ph, img.naturalWidth, img.naturalHeight, cell);
      if (pl) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, pw, ph); ctx.clip(); ctx.translate(pl.cx, pl.cy); ctx.rotate(((cell.rot || 0) * Math.PI) / 180); ctx.drawImage(img, -pl.Rw / 2, -pl.Rh / 2, pl.Rw, pl.Rh); ctx.restore(); }
    }
    if (opts.safety) {
      const mmPx = scale / 25.4, cut3 = Math.round(5 * mmPx), safe7 = Math.round(safeMM * mmPx), lw = Math.max(1.5, Math.round(m * 0.004));
      ctx.strokeStyle = "rgba(226,42,42,0.95)"; ctx.lineWidth = lw; ctx.strokeRect(cut3, cut3, pw - cut3 * 2, ph - cut3 * 2);
      ctx.strokeStyle = "rgba(35,110,240,0.95)"; ctx.lineWidth = lw + 1; ctx.strokeRect(safe7, safe7, pw - safe7 * 2, ph - safe7 * 2);
    }

    return cv;
  };
  const collectSetCells = () => cells;

  const generateSetPreviewCanvas = async () => {
    const store = collectSetCells();
    const pad = 44, gap = 34, ppi = 42, labelH = 26;
    const dims = setFrames.map((f, i) => { const s = Math.min(toIn(f.w, f.u), toIn(f.h, f.u)) * ppi, l = Math.max(toIn(f.w, f.u), toIn(f.h, f.u)) * ppi; const land = store[i] && store[i].landscape; return land ? { w: l, h: s } : { w: s, h: l }; });
    const boardW = dims.reduce((a, d) => a + d.w, 0) + gap * (dims.length - 1) + pad * 2;
    const boardH = Math.max(...dims.map((d) => d.h)) + pad * 2 + labelH + 40;
    const board = document.createElement("canvas"); board.width = Math.round(boardW); board.height = Math.round(boardH);
    const bx = board.getContext("2d"); bx.fillStyle = "#FFFFFF"; bx.fillRect(0, 0, board.width, board.height);

    bx.fillStyle = "#E2503C"; bx.font = "bold 14px sans-serif"; bx.textAlign = "left";

    bx.fillStyle = "#236EF0";
    bx.fillText("※ 파란선은 안전선", pad, pad + 20);

    const baseY = boardH - pad - labelH;
    let x = pad;
    for (let i = 0; i < setFrames.length; i++) {
      const cv = await buildSetFrame(store[i], setFrames[i], { preview: true, watermark: true, safety: true });

  const submitSet = async () => {

    }

    if (portfolioConsent) files.push(await buildConsentProofFile());   // 동의 증빙 기록 저장
    if (!APPS_SCRIPT_URL) return showToast("주문 접수 (데모 · 드라이브 미연결)");

    catch (e) { setSendState(null); showToast("전송 실패 · 잠시 후 다시 시도해 주세요"); }
  };

  const openUpload = (kind) => { setSetKind(null); setUploadKind(kind); setUploadPhotos([]); goScreen("designer"); setOrderInfoOpen(true); };
  const openAlbum = () => goScreen("albumSoon");
  const openPicker = (idx) => {

    if (!setKind && !size) return showToast("액자 사이즈를 먼저 선택해 주세요");

  const onUploadFiles = (e) => { const files = Array.from(e.target.files || []); if (!files.length) return; const max = uploadKind === "album" ? 100 : 10; readFiles(files).then((srcs) => setUploadPhotos((prev) => [...prev, ...srcs].slice(0, max))); };

  // 모바일 터치 제스처: 손가락 1개로 잠깐 누르면 스크롤(아무것도 안 함),
  // 손가락 1개로 꾹 누르고 있으면(롱프레스) 칸 이동 모드 시작,
  // 손가락 2개(핀치)로는 확대/축소 · 회전 · 위치이동을 동시에 처리.
  useEffect(() => {
    const LONG_PRESS_MS = 450, MOVE_THRESHOLD = 10;
    const onDown = (e) => {
      if (e.pointerType !== "touch") return;
      const directCellEl = e.target.closest && e.target.closest("[data-cellidx]");
      let idx, cellEl, offCell = false;
      if (lockedRef.current != null) {
        // 잠긴 칸이 있으면 화면 어디를 터치해도(액자 밖이어도) 그 칸을 확대/회전/이동 대상으로 삼음 — 액자는 고정돼 있으니까
        idx = lockedRef.current;
        cellEl = document.querySelector(`[data-cellidx="${idx}"]`);

      } else {

        idx = cellEl ? Number(cellEl.getAttribute("data-cellidx")) : null;
      }
      if (!cellEl || idx == null || !cellsRef.current[idx] || !cellsRef.current[idx].src) return;
      const noReorder = !!(cellEl.classList && cellEl.classList.contains("hscroll")); // 미니세트는 액자 크기가 제각각이라 칸 이동(롱프레스) 없이 가로 스크롤만 되게 함
      let g = gestureRef.current;
      if (!g || g.idx !== idx) {

      }
      g.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (g.pointers.size === 1) {

            )}
            {exampleModal.gapIdx ? (
              <button className="nf-navarrow" disabled={exampleModal.gapIdx >= 3} onClick={() => { const gi = exampleModal.gapIdx + 1; setWoodGapIdx(gi); setExampleImgError(false); setExampleModal({ src: `../example/w${gi}${layout.cuts === 12 ? "-12" : ""}.jpg`, label: `우드 ${gapLabel(gi)} 제작 예시`, gapIdx: gi }); }}><Ic name="chevronright" size={18} /></button>
            ) : <div style={{ width: 38 }} />}
          </div>
          <div style={{ color: "#fff", fontSize: 12.5, fontWeight: 700 }} onClick={(e) => e.stopPropagation()}>{exampleModal.label}</div>
          <button className="nf-btn dark" style={{ width: "auto", padding: "10px 26px" }} onClick={() => setExampleModal(null)}>닫기</button>
        </div>
      )}

      {previewWarn && (
        <div className="nf-overlay" style={{ zIndex: 240 }}>
          <div className="nf-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><div style={{ width: 56, height: 56, borderRadius: "50%", background: DANGER_TINT, display: "flex", alignItems: "center", justifyContent: "center" }}><Ic name="alerttriangle" size={26} color={RED} /></div></div>
            <div style={{ textAlign: "center", fontSize: 16, fontWeight: 700, marginBottom: 12, color: INK }}>개인정보 수집·이용 동의가 필요합니다</div>
            <div style={{ fontSize: 13, color: INK, lineHeight: 1.8, background: DANGER_TINT, borderRadius: 12, padding: "14px 16px", marginBottom: 14, textAlign: "center" }}>
              <b style={{ color: RED }}>[필수] 개인정보 수집·이용 동의</b>에 체크하지 않으면<br />주문 파일을 업로드할 수 없습니다.<br />
              <span style={{ color: SUBTLE }}>'성함·연락처 확인/수정'에서 체크해 주세요.</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="nf-btn ghost" style={{ flex: 1 }} onClick={() => { const k = previewWarn; setPreviewWarn(null); (k === "set" ? openSetPreview : openPreview)(); }}>미리보기 계속</button>
              <button className="nf-btn dark" style={{ flex: 1 }} onClick={() => { setPreviewWarn(null); setOrderInfoOpen(true); }}>동의하러 가기</button>
            </div>
          </div>
        </div>
      )}

      {showGiftPopup && (
        <div className="nf-overlay" style={{ zIndex: 260 }}>
          <div className="nf-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><div style={{ width: 56, height: 56, borderRadius: "50%", background: PINK_BG, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>🎁</div></div>
            <div style={{ textAlign: "center", fontSize: 16, fontWeight: 700, marginBottom: 12, color: INK }}>포트폴리오 이용 동의 안내</div>
            <div style={{ fontSize: 13, color: INK, lineHeight: 1.85, background: "#F8F5F1", borderRadius: 12, padding: "14px 16px", marginBottom: 14, textAlign: "center" }}>
              액자 완성품을 촬영한 사진이 네모프레임 사이트, 상세페이지 등 포트폴리오 활용에 업로드 될 수 있음에 동의하시겠습니까?<br />
              <span style={{ color: PINK, fontWeight: 700 }}>동의하실 경우 보관용 부직포 가방이 제공됩니다. (6천원 상당)</span><br />
              <span style={{ color: SUBTLE }}>이미 구매하신 경우 환불해드립니다.</span>
            </div>
            <div style={{ fontSize: 11.5, color: SUBTLE, textAlign: "center" }}>포트폴리오 활용동의에 따라 개인정보 수집 및 활용에 동의합니다.</div>
            <div style={{ fontSize: 11.5, color: SUBTLE, textAlign: "center", marginBottom: 14, textDecoration: "underline" }}>공장 직배송의 경우에는 촬영이 불가함으로 제공이 불가합니다.</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="nf-btn ghost" style={{ flex: 1 }} onClick={() => { setPortfolioConsent(false); setShowGiftPopup(false); }}>미동의합니다</button>
              <button className="nf-btn dark" style={{ flex: 1, background: PINK, borderColor: PINK }} onClick={() => { setPortfolioConsent(true); setShowGiftPopup(false); }}>동의합니다</button>
            </div>
          </div>
        </div>
      )}

      {showPopup && (
        <div className="nf-overlay" onClick={() => setShowPopup(false)}>
          <div className="nf-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><div style={{ width: 52, height: 52, borderRadius: "50%", background: DANGER_TINT, display: "flex", alignItems: "center", justifyContent: "center" }}><i className="ti ti-alert-triangle" style={{ fontSize: 24, color: RED }} aria-hidden="true" /></div></div>
            <div style={{ textAlign: "center", fontSize: 15.5, fontWeight: 700, marginBottom: 12, color: INK }}>업로드 전 꼭 확인해 주세요</div>
            <div style={{ fontSize: 12.5, color: INK, lineHeight: 1.85, background: LINE, borderRadius: 12, padding: "14px 15px", marginBottom: 18 }}>
              <b style={{ color: RED }}>네이버 또는 자사몰에서 결제 정보가 확인되지 않으면</b>, 사진을 업로드하셔도 작업이 진행되지 않습니다.<br /><b>주문자명과 구매자 성함이 다를 경우 작업이 불가합니다.</b><br />액자는 모니터보다 어두워집니다. 어두운 사진은 보정요청을 해주세요.
            </div>
            <button className="nf-btn dark" onClick={() => { setShowPopup(false); setOrderInfoOpen(true); }}>확인했습니다</button>
          </div>
        </div>
      )}

      {moving && moveFromRef.current != null && cells[moveFromRef.current]?.src && (<div className="nf-ghost" style={{ left: movePos.x, top: movePos.y }}><img src={cells[moveFromRef.current].src} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /></div>)}
      {lockedIdx != null && (screen === "build" || screen === "setBuild") && <div className="nf-lock-overlay" onClick={unlock} />}
      {lockedIdx != null && (screen === "build" || screen === "setBuild") && <div className="nf-lock-hint">두 손가락으로 확대·회전, 한 손가락으로 이동 · 다시 누르면 잠금 해제</div>}
      {toast && <div className="nf-toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NemoFrameMobile />);
</script>
</body>
</html>
