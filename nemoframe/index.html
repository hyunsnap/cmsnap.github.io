<script>
/* 휴대폰으로 들어오면 모바일 페이지(mobile/)로 보낸다.
   이 분기가 없어서 폰에서도 PC(베이지) 화면이 열렸고, 마우스용 이동 손잡이라 순서 바꾸기 터치가 안 먹었다.
   모바일 페이지의 "PC 버전으로 보기"( ../index.html?pc=1 )로 들어오면 넘기지 않고, 그 선택을 탭이 닫힐 때까지 기억한다.
   화면 그리기 전에 실행돼야 깜빡임이 없으므로 <head> 맨 위에 둔다. */
(function () {
  try {
    var qs = location.search || "";
    if (/[?&]pc=1/.test(qs)) { try { sessionStorage.setItem("nf_pc", "1"); } catch (e) {} return; }
    if (sessionStorage.getItem("nf_pc") === "1") return;

    var ua = navigator.userAgent || "";
    var phone = /Android|iPhone|iPod|IEMobile|BlackBerry|Opera Mini|Mobile Safari/i.test(ua)
             || (/iPad|Macintosh/.test(ua) && "ontouchend" in document && Math.min(screen.width, screen.height) < 820);
    if (!phone) return;

    // 주소 끝에 '/' 가 없어도(예: /nemoframe/nemo_upload) 폴더를 올바로 계산한다
    var p = location.pathname;
    if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) p += "/";
    var dir = p.replace(/[^/]*$/, "");
    if (/\/mobile\/$/.test(dir)) return;              // 이미 모바일 페이지면 그대로
    location.replace(dir + "mobile/" + qs + location.hash);
  } catch (e) { /* 문제가 생기면 그냥 PC 화면을 보여준다 */ }
})();
</script>

  const c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));

            <div style={{ textAlign: "center", fontSize: 16, fontWeight: 700, marginBottom: 12 }}>미리보기로 확인하셨나요?</div>
            <div style={{ border: `2px solid ${RED}`, borderRadius: 10, background: "#FEF4F2", padding: "10px 12px", marginBottom: 14, textAlign: "center" }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: RED }}>⚠️ 본 페이지는 주문 페이지가 아닙니다</div>
              <div style={{ fontSize: 12, color: INK, marginTop: 4, lineHeight: 1.5 }}>스마트스토어 또는 자사몰에서 주문하신 상품의<br />사진 파일을 업로드하는 클라우드입니다.</div>
            </div>
            <div style={{ fontSize: 13, color: INK, lineHeight: 1.8, background: "#F8F5F1", borderRadius: 12, padding: "14px 16px", marginBottom: 18, textAlign: "center" }}>
              주문 이후에는 <b style={{ color: RED }}>사진 배치 수정이 불가</b>합니다. 사진 배치 수정이 필요하신 경우에는 <b>재배치 후</b> 주문 버튼을 눌러주세요.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="nf-btn" onClick={() => setOrderConfirm(false)}>재 수정하기</button>
              <button className="nf-btn dark" onClick={() => { setOrderConfirm(false); (setKind ? submitSet : submitOrder)(); }}>확인</button>
            </div>
          </div>
        </div>
      )}

      {setPickerOpen && (
        <div className="nf-overlay" onClick={() => setSetPickerOpen(false)}>
          <div className="nf-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ textAlign: "center", fontSize: 16, fontWeight: 700, marginBottom: 4 }}>미니액자 세트 선택</div>
            <div style={{ textAlign: "center", fontSize: 12, color: SUBTLE, marginBottom: 16 }}>크기별로 액자를 하나씩 채우게 돼요</div>
            {Object.keys(MINI_SETS).map((k) => (
              <button key={k} className="nf-btn" style={{ marginBottom: 10, justifyContent: "space-between" }} onClick={() => chooseSet(k)}>
                <b>{MINI_SETS[k].label}</b><span style={{ fontSize: 11, color: SUBTLE }}>{MINI_SETS[k].desc}</span>
              </button>
            ))}
            <div style={{ fontSize: 11, color: SUBTLE, textAlign: "center", marginTop: 6 }}>6p(대형+미니 풀패키지)는 준비 중입니다.</div>
          </div>
        </div>
      )}

      {orderInfoOpen && (
        <div className="nf-overlay" style={{ zIndex: 120 }}>
          <div className="nf-modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: 440, maxHeight: "90vh", overflow: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div className="nf-serif" style={{ fontSize: 20, fontWeight: 700, color: INK }}>주문 정보 입력</div>
              <button onClick={() => setOrderInfoOpen(false)} style={{ border: "none", background: "#F1E9DB", width: 34, height: 34, borderRadius: 10, cursor: "pointer", fontSize: 17, color: SUBTLE, lineHeight: 1 }}>✕</button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>{OrderInfo()}</div>
            <button className="nf-btn dark" style={{ marginTop: 16 }} disabled={!form.name || !form.phone || !consent} onClick={() => { if (!form.name || !form.phone) return showToast("성함과 연락처를 입력해 주세요"); if (!consent) return showToast("개인정보 수집·이용 동의가 필요합니다"); setOrderInfoOpen(false); }}><Ic name="check" size={15} /> 입력 완료</button>
          </div>
        </div>
      )}

      {previewSrc && (
        <div className="nf-overlay" onClick={() => setPreviewSrc(null)} style={{ flexDirection: "column", gap: 14 }}>
          <img src={previewSrc} alt="미리보기" onClick={(e) => e.stopPropagation()} style={{ maxWidth: "96vw", maxHeight: "78vh", borderRadius: 0, boxShadow: "0 20px 60px rgba(0,0,0,0.5)", background: "#fff" }} />

          <div style={{ color: "#fff", fontSize: 12.5, textAlign: "center", maxWidth: 900, lineHeight: 1.65, background: "rgba(0,0,0,0.5)", padding: "11px 18px", borderRadius: 10 }}>
            <b style={{ color: "#ff8a80" }}>빨강 = 재단선(약 5mm)</b> · <b style={{ color: "#7cc0ff" }}>파랑 = 안전선(약 {setKind ? 8 : safeMM}mm)</b><br />
            인쇄 후 재단하고, 그 위에 아크릴을 붙여 다시 자르는 과정에서 <b style={{ color: "#7cc0ff" }}>파일 가장자리가 5mm부터 최대 {setKind ? 8 : safeMM}mm까지 잘릴 수 있어요.</b> <br />인물 · 손 · 발 · 관절 등 중요한 부분은 꼭 <b style={{ color: "#7cc0ff" }}>안전선(파랑) 안쪽</b>에 두세요. 잘림이 걱정되면 가능한 부분까지 완료하신 후 상담원에게 <b style={{ color: "#a5e3a5" }}>AI 확장편집</b>을 요청해주세요.<br /><br /><span style={{ color: "#ffd9a0", fontWeight: 700 }}>※ 전국 모든 액자공장 공통현상</span><br />보통은 재단선 정도에서 잘립니다.<br />여유있게 안전선을 넣어드렸답니다. 관절 및 중요한 부분이 파란선에 닿는 경우에는 우선 주문완료 후 상담원에게 보정요청을 해주세요.
          </div>

          <button className="nf-btn dark" style={{ width: "auto", padding: "10px 26px" }} onClick={() => setPreviewSrc(null)}>닫기</button>
        </div>
      )}

      {showPopup && (
        <div className="nf-overlay" onClick={() => setShowPopup(false)}>
          <div className="nf-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><div style={{ width: 56, height: 56, borderRadius: "50%", background: "#FBF0ED", display: "flex", alignItems: "center", justifyContent: "center" }}><Ic name="alerttriangle" size={28} color={RED} /></div></div>
            <div style={{ textAlign: "center", fontSize: 16, fontWeight: 700, marginBottom: 12 }}>업로드 전 꼭 확인해 주세요</div>
            <div style={{ fontSize: 13, color: INK, lineHeight: 1.85, background: "#F8F5F1", borderRadius: 12, padding: "14px 16px", marginBottom: 18 }}>
              <b style={{ color: RED }}>네이버 또는 자사몰에서 결제 정보가 확인되지 않으면</b>,<br />사진을 업로드하셔도 작업이 진행되지 않습니다❌<br /><b>주문자명과 구매자 성함이 다를 경우 작업불가❌</b><br />액자는 모니터보다 20% 가량 어두워집니다. (무광은 30%)<br />어두운 사진은 보정요청을 해주세요.
            </div>
            <button className="nf-btn dark" onClick={() => { setShowPopup(false); setOrderInfoOpen(true); }}>확인했습니다</button>
          </div>
        </div>
      )}

      {moving && moveFromRef.current != null && cells[moveFromRef.current]?.src && (<div className="nf-ghost" style={{ left: movePos.x, top: movePos.y }}><img src={cells[moveFromRef.current].src} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /></div>)}
      {toast && <div className="nf-toast">{toast}</div>}
    </div>
  );
}

function MiniFrame({ cols, rows, dir }) {
  const w = dir === "portrait" ? 56 : 86, h = dir === "portrait" ? 84 : 56;
  return (
    <div style={{ width: w, height: h, background: "#2A2724", borderRadius: 2, padding: 2 }}>
      <div style={{ width: "100%", height: "100%", background: "#FFFFFF", padding: 4, boxSizing: "border-box", display: "grid", gridTemplateColumns: `repeat(${cols},1fr)`, gridTemplateRows: `repeat(${rows},1fr)`, gap: 3 }}>
        {Array.from({ length: cols * rows }).map((_, i) => (<div key={i} style={{ background: "#D8CFC2", borderRadius: 1 }} />))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NemoFrameOrder />);
</script>
</body>
</html>
